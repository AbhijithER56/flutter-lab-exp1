<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juicy Basket – Experiment 1 | Flutter Widgets & Layouts</title>
  <meta name="description" content="Flutter Lab Experiment 1: Working with Widgets and Layouts – Juicy Basket fruit shop demonstrating Row, Column, Container, Card, and ListView widgets." />
  <style>
    :root {
      --bg: #1B1430;
      --surface: #2A2145;
      --amber: #FFB703;
      --coral: #FB5607;
      --soft: #B9B0D6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 20% 10%, #3a2a66, #120c22 70%);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      color: #fff;
    }

    /* ── Phone shell ── */
    .phone {
      width: 390px;
      height: 820px;
      background: var(--bg);
      border-radius: 40px;
      border: 8px solid #0b0716;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── AppBar (Row) ── */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 20px 12px;
      flex-shrink: 0;
    }
    .app-title { font-size: 22px; font-weight: 800; color: var(--amber); letter-spacing: .5px; }
    .basket-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid rgba(255,183,3,.6);
      border-radius: 20px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 14px;
    }

    /* ── Hero banner (Container + Row + Column) ── */
    .hero {
      margin: 4px 16px 12px;
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--coral), var(--amber));
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 16px rgba(251,86,7,.35);
      flex-shrink: 0;
    }
    .hero-text { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .hero-eyebrow { font-size: 11px; letter-spacing: 2px; font-weight: 600; color: rgba(255,255,255,.75); }
    .hero-title { font-size: 20px; font-weight: 800; line-height: 1.2; }
    .hero-sub { font-size: 10px; color: rgba(255,255,255,.75); margin-top: 2px; }
    .hero-emoji { font-size: 54px; line-height: 1; }

    /* ── Section label (Row) ── */
    .section {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 20px;
      flex-shrink: 0;
    }
    .section b { font-size: 16px; }
    .section span { font-size: 12px; color: var(--soft); }

    /* ── ListView ── */
    .list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 16px 12px;
      display: flex; flex-direction: column; gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a3d78 transparent;
    }

    /* ── FruitCard (Card + Row + Column) ── */
    .card {
      --tint: #fff;
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      min-height: 92px;
      flex-shrink: 0;
      transition: transform .18s ease;
    }
    .card:hover { transform: translateX(4px); }
    .stripe { width: 6px; align-self: stretch; background: var(--tint); }
    .emoji {
      width: 58px; height: 58px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; flex-shrink: 0;
      background: color-mix(in srgb, var(--tint) 18%, transparent);
    }
    .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .name { font-size: 17px; font-weight: 700; }
    .tag { font-size: 12px; color: var(--soft); }
    .price { font-size: 13px; font-weight: 700; color: var(--amber); margin-top: 4px; }

    /* ── Stepper ── */
    .stepper { display: flex; align-items: center; gap: 8px; padding-right: 12px; }
    .qty { font-weight: 700; min-width: 14px; text-align: center; }
    .btn {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1.5px solid var(--amber);
      background: transparent; color: var(--amber);
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    .btn.fill { background: var(--amber); color: var(--bg); }
    .btn:active { transform: scale(.9); }
    .hidden { display: none; }

    /* ── Checkout bar (Container + Row) ── */
    .checkout {
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 14px 20px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .checkout small { display: block; font-size: 11px; color: var(--soft); }
    .total { font-size: 22px; font-weight: 800; color: var(--amber); }
    .count { color: var(--soft); font-size: 13px; }
  </style>
</head>
<body>

  <div class="phone">
    <!-- AppBar -->
    <div class="app-bar">
      <div class="app-title">Juicy Basket</div>
      <div class="basket-chip">🧺 <span id="chipCount">0</span></div>
    </div>

    <!-- Hero banner -->
    <div class="hero">
      <div class="hero-text">
        <span class="hero-eyebrow">EXPERIMENT 1</span>
        <span class="hero-title">Fresh picks,<br />straight to you</span>
        <span class="hero-sub">Row · Column · Container · Card · ListView</span>
      </div>
      <div class="hero-emoji">🧺</div>
    </div>

    <!-- Section label -->
    <div class="section"><b>Today's Harvest</b><span id="variety"></span></div>

    <!-- ListView -->
    <div class="list" id="list"></div>

    <!-- Checkout bar -->
    <div class="checkout">
      <div><small>Basket total</small><div class="total">₹ <span id="total">0</span></div></div>
      <div class="count"><span id="count">0 items</span></div>
    </div>
  </div>

  <script>
    const fruits = [
      { emoji: '🍎', name: 'Apple',      tag: 'Crisp & juicy',      price: 80,  unit: 'kg',    tint: '#EF476F' },
      { emoji: '🍌', name: 'Banana',     tag: 'Rich in potassium',  price: 40,  unit: 'dozen', tint: '#FFD166' },
      { emoji: '🥭', name: 'Mango',      tag: 'King of fruits',     price: 120, unit: 'kg',    tint: '#FF9F1C' },
      { emoji: '🍊', name: 'Orange',     tag: 'Full of vitamin C',  price: 60,  unit: 'kg',    tint: '#FB5607' },
      { emoji: '🍇', name: 'Grapes',     tag: 'Sweet & seedless',   price: 90,  unit: 'kg',    tint: '#B388EB' },
      { emoji: '🍓', name: 'Strawberry', tag: 'Hand-picked daily',  price: 150, unit: 'box',   tint: '#FF5D8F' },
    ];
    const qty = fruits.map(() => 0);
    const list = document.getElementById('list');

    document.getElementById('variety').textContent = fruits.length + ' varieties';

    fruits.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.style.setProperty('--tint', f.tint);
      el.innerHTML = `
        <div class="stripe"></div>
        <div class="emoji">${f.emoji}</div>
        <div class="info">
          <span class="name">${f.name}</span>
          <span class="tag">${f.tag}</span>
          <span class="price">₹ ${f.price} / ${f.unit}</span>
        </div>
        <div class="stepper">
          <button class="btn minus hidden">−</button>
          <span class="qty hidden">0</span>
          <button class="btn fill plus">+</button>
        </div>`;
      const minus = el.querySelector('.minus');
      const q = el.querySelector('.qty');
      el.querySelector('.plus').onclick = () => change(1);
      minus.onclick = () => change(-1);
      function change(d) {
        qty[i] = Math.max(0, Math.min(99, qty[i] + d));
        q.textContent = qty[i];
        minus.classList.toggle('hidden', qty[i] === 0);
        q.classList.toggle('hidden', qty[i] === 0);
        update();
      }
      list.appendChild(el);
    });

    function update() {
      const items = qty.reduce((a, b) => a + b, 0);
      const total = qty.reduce((s, n, i) => s + n * fruits[i].price, 0);
      document.getElementById('chipCount').textContent = items;
      document.getElementById('total').textContent = total;
      document.getElementById('count').textContent = items + (items === 1 ? ' item' : ' items');
    }
  </script>
</body>
</html>
